<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            background: #f8f9fa;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .header h1 {
            color: #2c3e50;
            font-size: 18px;
            margin: 0 0 5px 0;
        }
        
        .header p {
            color: #7f8c8d;
            font-size: 12px;
            margin: 0;
        }
        
        .fill-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }
        
        .fill-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .fill-button:active {
            transform: translateY(0);
        }
        
        .fill-button:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .results {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid #e1e8ed;
            display: none;
        }
        
        .results.show {
            display: block;
        }
        
        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f1f3f4;
        }
        
        .result-item:last-child {
            border-bottom: none;
        }
        
        .result-label {
            color: #34495e;
            font-size: 14px;
        }
        
        .result-count {
            background: #3498db;
            color: white;
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status {
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-top: 10px;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .options {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #e1e8ed;
        }
        
        .option-group {
            margin-bottom: 12px;
        }
        
        .option-group:last-child {
            margin-bottom: 0;
        }
        
        .option-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
            color: #34495e;
        }
        
        .option-label input[type="checkbox"] {
            margin-right: 8px;
        }
        
        .divider {
            height: 1px;
            background: #e1e8ed;
            margin: 15px 0;
        }
        
        [hidden] {
            display: none !important;
        }

        .form-selector {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #e1e8ed;
        }
        
        .form-selector h3 {
            margin: 0 0 15px 0;
            color: #2c3e50;
            font-size: 16px;
        }
        
        .form-list {
            max-height: 200px;
            overflow-y: auto;
        }
        
        .form-item {
            background: #f8f9fa;
            border: 1px solid #e1e8ed;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .form-item:last-child {
            margin-bottom: 0;
        }
        
        .form-item:hover {
            background: #e8f4fd;
            border-color: #3498db;
            transform: translateY(-1px);
        }
        
        .form-item:active {
            transform: translateY(0);
        }
        
        .form-name {
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 4px;
        }
        
        .form-details {
            font-size: 12px;
            color: #7f8c8d;
            display: flex;
            gap: 12px;
        }
        
        .form-detail-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .fill-button.secondary {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
        }
        
        .fill-button.secondary:hover {
            box-shadow: 0 4px 12px rgba(149, 165, 166, 0.4);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>😎 Shamelessly Vibe-Coded Form Filler</h1>
        <p>Fill forms with random data instantly</p>
    </div>
    
    <div class="options">
        <div class="option-group">
            <label class="option-label">
                <input type="checkbox" id="fillTexts" checked>
                Fill text inputs & textareas
            </label>
        </div>
        <div class="option-group">
            <label class="option-label">
                <input type="checkbox" id="fillDropdowns" checked>
                Fill dropdown menus
            </label>
        </div>
        <div class="option-group">
            <label class="option-label">
                <input type="checkbox" id="fillRadios" checked>
                Fill radio buttons
            </label>
        </div>
        <div class="option-group">
            <label class="option-label">
                <input type="checkbox" id="fillCheckboxes" checked>
                Fill checkboxes
            </label>
        </div>
        
        <div class="divider"></div>
        
        <div class="option-group">
            <label class="option-label">
                <input type="checkbox" id="onlyEmptyFields" checked>
                Only fill empty/blank fields
            </label>
        </div>
        <div class="option-group">
            <label class="option-label">
                <input type="checkbox" id="suppressUnicode">
                Suppress Unicode characters (ASCII only)
            </label>
        </div>
    </div>
    
    <div id="formSelector" class="form-selector" hidden>
        <h3>Select Form to Fill:</h3>
        <div id="formList" class="form-list"></div>
        <div class="divider"></div>
        <button id="fillAllFormsBtn" class="fill-button secondary">
            Fill All Forms
        </button>
    </div>
    
    <button id="fillFormsBtn" class="fill-button">
        Fill Forms Now
    </button>
    
    <div id="results" class="results">
        <div class="result-item">
            <span class="result-label">Text Fields</span>
            <span id="textCount" class="result-count">0</span>
        </div>
        <div class="result-item">
            <span class="result-label">Dropdowns</span>
            <span id="dropdownCount" class="result-count">0</span>
        </div>
        <div class="result-item">
            <span class="result-label">Radio Groups</span>
            <span id="radioCount" class="result-count">0</span>
        </div>
        <div class="result-item">
            <span class="result-label">Checkboxes</span>
            <span id="checkboxCount" class="result-count">0</span>
        </div>
    </div>
    
    <div id="status"></div>
    
    <script src="popup.js"></script>
</body>
</html>
